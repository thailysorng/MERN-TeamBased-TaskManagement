services:
  server:
    build: ./server
    ports:
      - "8800:8800"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  server_node_modules:
  client_node_modules: